schema_version: 1
purpose: Phase 4 capacity calibration and immediate-cutover characterization
dataset:
  seed: 404
  keys: 512
  value_bytes: 1024
routing:
  mapping_seed: 20261019
  virtual_buckets: 64
  old_nodes: [old-1, old-2]
  final_nodes: [old-1, old-2, new]
  destination: new
services:
  cache: {host: 127.0.0.1, ports: [16379, 16380, 16381], socket_timeout_seconds: 1.0, maxmemory_bytes: 33554432, eviction_policy: allkeys-lru}
  database: {host: 127.0.0.1, port: 15432, dbname: paper2_research, user: paper2_research, password_env: PAPER2_DB_PASSWORD, pool_timeout_seconds: 2.0, statement_timeout_ms: 1500, query_cpu_rounds: 20000}
resources:
  foreground_db_connections: 4
  background_db_connections: 1
  foreground_cache_connections_per_node: 8
  background_cache_connections_per_node: 1
  migration_workers: 1
