[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-scaleout"
version = "0.0.1"
description = "Local cache expansion research prototype"
requires-python = ">=3.12,<3.13"
dependencies = ["redis==6.4.0", "psycopg[binary,pool]==3.2.10", "PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

