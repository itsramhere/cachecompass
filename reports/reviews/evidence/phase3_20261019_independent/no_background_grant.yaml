schema_version: 1
purpose: Phase 3 expected no-background-grant policy failure; independent accounting
  check
provisional: true
dataset:
  seed: 42
  keys: 48
  value_bytes: 128
routing:
  mapping_seed: 2026
  virtual_buckets: 16
  old_nodes:
  - old-1
  - old-2
  final_nodes:
  - old-1
  - old-2
  - new
  destination: new
services:
  cache:
    host: 127.0.0.1
    ports:
    - 16379
    - 16380
    - 16381
    socket_timeout_seconds: 1.0
    maxmemory_bytes: 33554432
    eviction_policy: allkeys-lru
  database:
    host: 127.0.0.1
    port: 15432
    dbname: paper2_research
    user: paper2_research
    password_env: PAPER2_DB_PASSWORD
    pool_timeout_seconds: 2.0
    statement_timeout_ms: 1000
resources:
  foreground_db_connections: 2
  background_db_connections: 1
  foreground_cache_connections_per_node: 2
  background_cache_connections_per_node: 1
  migration_workers: 2
  max_inflight_requests: 8
  max_coalesced_keys: 4
  max_pending_migration_tasks: 64
  max_pending_metric_records: 512
  max_buffered_payload_bytes: 512
timing:
  run_timeout_seconds: 30
  foreground_timeout_seconds: 2.0
  cleanup_timeout_seconds: 1.0
  migration_attempt_timeout_seconds: 1.0
  metric_timeout_seconds: 1.0
  flush_timeout_seconds: 5.0
  observation_interval_seconds: 0.1
  observation_timeout_seconds: 0.5
  expansion_at_seconds: 0.25
  task_lifetime_seconds: 1.5
  handover_deadline_seconds: 3.0
  measurement_horizon_seconds: 4.2
  stability_start_seconds: 2.5
  stability_subwindow_seconds: 0.1
  stability_subwindows: 2
  stability_min_requests: 2
retries:
