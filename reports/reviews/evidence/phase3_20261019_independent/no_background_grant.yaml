    max_attempts: 1
    attempt_timeout_seconds: 1.0
    backoff_seconds: []
  foreground_database:
    max_attempts: 2
    attempt_timeout_seconds: 1.0
    backoff_seconds:
    - 0.01
  foreground_fill_write:
    max_attempts: 2
    attempt_timeout_seconds: 1.0
    backoff_seconds:
    - 0.01
  donor_read:
    max_attempts: 2
    attempt_timeout_seconds: 1.0
    backoff_seconds:
    - 0.01
  warmup_database:
    max_attempts: 2
    attempt_timeout_seconds: 1.0
    backoff_seconds:
    - 0.01
  destination_write:
    max_attempts: 2
    attempt_timeout_seconds: 1.0
    backoff_seconds:
    - 0.01
observations:
  maximum_rounds: 64
  probe_byte_ceiling: 65536
  subwindow_ns: 1000000000
